version: '3.8'

services:
  backend:
    build: ./backend
    container_name: chichihehe-backend
    environment:
      - SECRET_KEY=your-production-secret-key-here
      - JWT_SECRET_KEY=your-jwt-secret-key-here
    volumes:
      - backend-data:/app/uploads
      - sqlite-data:/app
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: chichihehe-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  sqlite-data:
